apiVersion: apps/v1
kind: Deployment
metadata:
  name: doorstep
spec:
  template:
    spec:
      containers:
        - name: doorstep
          env:
            - name: DOORSTEP_REGISTRY_CREDENTIALS_FILE
              value: /etc/doorstep/registry/.dockerconfigjson
          volumeMounts:
            - name: registry-credentials
              mountPath: /etc/doorstep/registry
              readOnly: true
      volumes:
        - name: registry-credentials
          secret:
            secretName: doorstep-registry
            defaultMode: 0440
