apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: doorstep-jobs-reader
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: doorstep-jobs-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: doorstep-jobs-reader
subjects:
  - kind: ServiceAccount
    name: doorstep
