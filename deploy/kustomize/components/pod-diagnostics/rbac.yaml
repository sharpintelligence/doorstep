apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: doorstep-pods-reader
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: doorstep-pods-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: doorstep-pods-reader
subjects:
  - kind: ServiceAccount
    name: doorstep
