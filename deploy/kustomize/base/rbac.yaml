apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: doorstep-applications-reader
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: doorstep-applications-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: doorstep-applications-reader
subjects:
  - kind: ServiceAccount
    name: doorstep
