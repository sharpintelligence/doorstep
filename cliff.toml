[changelog]
body = """
{% for group, commits in commits | group_by(attribute="group") %}\
### {{ group }}

{% for commit in commits %}\
- {{ commit.message | split(pat="\\n") | first | trim }}
{% endfor %}
{% endfor %}\
"""
trim = true

[git]
conventional_commits = false
filter_unconventional = false
split_commits = false
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_preprocessors = [
  { pattern = '\s*\(doorstep-[A-Za-z0-9.]+\)', replace = "" },
  { pattern = '\(#(\d+)\)', replace = "([#${1}](https://github.com/sharpintelligence/doorstep/pull/${1}))" },
]
commit_parsers = [
  { message = '^Bump ', group = "Dependencies" },
  { field = "author.name", pattern = '(?i)dependabot', group = "Dependencies" },
  { message = '.*', group = "Changes" },
]
