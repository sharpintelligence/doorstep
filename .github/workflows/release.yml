name: Release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/sharpintelligence/doorstep

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      amd64_digest: ${{ steps.platforms.outputs.amd64 }}
      arm64_digest: ${{ steps.platforms.outputs.arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag and record commit time
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "tag $TAG is not a semantic version tag" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "commit $GITHUB_SHA is not on main" >&2
            exit 1
          fi
          echo "COMMIT_TIME=$(git log -1 --format=%cI "$GITHUB_SHA")" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            COMMIT_TIME=${{ env.COMMIT_TIME }}
          labels: |
            org.opencontainers.image.title=doorstep
            org.opencontainers.image.description=Deployment engine for Argo CD
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.created=${{ env.COMMIT_TIME }}
      - id: platforms
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          manifest=$(docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --format '{{json .Manifest}}')
          for arch in amd64 arm64; do
            platform_digest=$(jq -r --arg arch "$arch" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest' <<<"$manifest")
            if [[ ! "$platform_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "no $arch manifest in $DIGEST" >&2
              exit 1
            fi
            echo "$arch=$platform_digest" >> "$GITHUB_OUTPUT"
          done

  sbom:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            digest: ${{ needs.build.outputs.amd64_digest }}
          - arch: arm64
            digest: ${{ needs.build.outputs.arm64_digest }}
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          image: ${{ env.IMAGE }}@${{ matrix.digest }}
          syft-version: v1.57.2
          format: spdx-json
          output-file: sbom-${{ matrix.arch }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.arch }}
          path: sbom-${{ matrix.arch }}.spdx.json
          if-no-files-found: error
          retention-days: 7

  attest:
    needs: [build, sbom]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: write
      id-token: write
      attestations: write
    env:
      DIGEST: ${{ needs.build.outputs.digest }}
      AMD64_DIGEST: ${{ needs.build.outputs.amd64_digest }}
      ARM64_DIGEST: ${{ needs.build.outputs.arm64_digest }}
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sbom-*
          merge-multiple: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.AMD64_DIGEST }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.ARM64_DIGEST }}
          push-to-registry: true
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.AMD64_DIGEST }}
          sbom-path: sbom-amd64.spdx.json
          push-to-registry: true
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.ARM64_DIGEST }}
          sbom-path: sbom-arm64.spdx.json
          push-to-registry: true
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - run: cosign sign --yes --recursive "${IMAGE}@${DIGEST}"

  release:
    needs: [build, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      DIGEST: ${{ needs.build.outputs.digest }}
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.10.10
          install_args: git-cliff
      - name: Write release notes
        run: |
          cliff_flags=()
          if [[ "$TAG" != *-* ]]; then
            cliff_flags+=(--ignore-tags '-')
          fi
          git-cliff --latest --strip header "${cliff_flags[@]}" -o notes.md
          cat >> notes.md <<NOTES

          ### Container image

          \`\`\`
          ${IMAGE}@${DIGEST}
          \`\`\`

          Verify the signature and attestations before use:

          \`\`\`sh
          cosign verify ${IMAGE}@${DIGEST} \\
            --certificate-identity-regexp '^https://github.com/${GH_REPO}/\.github/workflows/release\.yml@refs/tags/v' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          gh attestation verify oci://${IMAGE}@${DIGEST} \\
            --repo ${GH_REPO} \\
            --signer-workflow ${GH_REPO}/.github/workflows/release.yml
          \`\`\`
          NOTES
      - name: Create release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
            exit 0
          fi
          flags=()
          if [[ "$TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md "${flags[@]}"
