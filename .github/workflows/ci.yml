name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
        env:
          POSTGRES_PASSWORD: doorstep
          POSTGRES_DB: doorstep_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d doorstep_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DOORSTEP_TEST_DATABASE_URL: postgres://postgres:doorstep@localhost:5432/doorstep_test?sslmode=disable
      DOORSTEP_TEST_REQUIRE_DATABASE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.10.10
      - run: just check
      - run: just build

  lint-manifests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.10.10
      - run: just lint-manifests

  migration-trailer:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require Doorstep-Migration on pull requests that change migrations
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- internal/store/migrations/)" ]; then
            echo "no migration changes"
            exit 0
          fi
          if git log --format=%B "$BASE_SHA..$HEAD_SHA" | grep -Eiq '^[[:space:]*>-]*doorstep-migration[[:space:]]*:[[:space:]]*(true|yes)[[:space:].]*$'; then
            echo "Doorstep-Migration trailer found"
            exit 0
          fi
          echo "::error::This pull request changes internal/store/migrations but none of its commits carries a 'Doorstep-Migration: true' line. Add one to a commit message so the squash-merge commit keeps it (see CONTRIBUTING.md#database-migrations)."
          exit 1

  govulncheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.10.10
      - run: just vuln

  image:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record commit time
        run: echo "COMMIT_TIME=$(git log -1 --format=%cI)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false
          sbom: false
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
            COMMIT_TIME=${{ env.COMMIT_TIME }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: doorstep:ci
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
            COMMIT_TIME=${{ env.COMMIT_TIME }}
      - name: Check version output
        run: |
          output=$(docker run --rm doorstep:ci version)
          echo "$output"
          for expected in "doorstep ci" "$GITHUB_SHA" "$COMMIT_TIME"; do
            if [[ "$output" != *"$expected"* ]]; then
              echo "version output is missing $expected" >&2
              exit 1
            fi
          done
